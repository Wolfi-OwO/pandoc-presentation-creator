stages:
  - validate_and_security
  - build
  - scan_and_test
  - push_image
  - cleanup
  - release

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1

  TAG_REGEX: '/^v\d+\.\d+\.\d+(\.\d+)?$/'

  CS_SEVERITY_THRESHOLD: CRITICAL
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

  # Optional external image handoff via Azure Blob Storage
  # Set USE_AZURE_BLOB_CACHE=true and configure the AZURE_* variables in GitLab CI/CD settings.
  USE_AZURE_BLOB_CACHE: "false"
  AZURE_BLOB_NAME: "pandoc-image-${CI_PIPELINE_ID}.tar"

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml

workflow:
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

# --------------------
# Secret Detection
# --------------------
secret_detection:
  stage: validate_and_security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - gitleaks detect --source . --report-format json --report-path gl-secret-report.json
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-report.json

# --------------------
# SAST (Semgrep)
# --------------------
sast:
  stage: validate_and_security
  image:
    name: returntocorp/semgrep
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - |
      semgrep scan \
        --config auto \
        --json \
        --severity ERROR \
        --project-dir "$CI_PROJECT_DIR" \
        > gl-sast-report.json || true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

# --------------------
# Dependency Scanning
# --------------------
dependency_scanning:
  stage: scan_and_test

# --------------------
# Build Docker Image
# --------------------
build_docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login \
        -u "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"

  script:
    - |
      # Use short SHA on branches/MRs; strip v-prefix from tag for releases
      # so the image label matches the registry tag (e.g. 1.2.3, not v1.2.3)
      IMAGE_VERSION="$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_VERSION="${CI_COMMIT_TAG#v}"
      fi

      docker build \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t "pandoc-beamer:local" \
        -f docker/Dockerfile.beamer .

      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"
      docker tag pandoc-beamer:local "$TEMP_IMAGE"
      docker push "$TEMP_IMAGE"

      if [ "$USE_AZURE_BLOB_CACHE" = "true" ]; then
        : "${AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_SAS:?AZURE_STORAGE_SAS is required when USE_AZURE_BLOB_CACHE=true}"

        docker save pandoc-beamer:local -o "$AZURE_BLOB_NAME"

        curl -sSL -o azcopy.tar.gz https://aka.ms/downloadazcopy-v10-linux
        tar -xzf azcopy.tar.gz
        AZCOPY_BIN="$(find . -type f -name azcopy | head -n1)"
        chmod +x "$AZCOPY_BIN"

        "$AZCOPY_BIN" copy \
          "$AZURE_BLOB_NAME" \
          "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${AZURE_BLOB_NAME}?${AZURE_STORAGE_SAS}" \
          --overwrite=true

        rm -f "$AZURE_BLOB_NAME" azcopy.tar.gz
      fi

  after_script:
    - docker logout "$CI_REGISTRY" || true

# --------------------
# Container Scanning (Trivy)
# --------------------
container_scan:
  stage: scan_and_test
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build_docker
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - |
      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"

      if [ "$USE_AZURE_BLOB_CACHE" = "true" ]; then
        : "${AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_SAS:?AZURE_STORAGE_SAS is required when USE_AZURE_BLOB_CACHE=true}"

        curl -sSL -o azcopy.tar.gz https://aka.ms/downloadazcopy-v10-linux
        tar -xzf azcopy.tar.gz
        AZCOPY_BIN="$(find . -type f -name azcopy | head -n1)"
        chmod +x "$AZCOPY_BIN"

        "$AZCOPY_BIN" copy \
          "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${AZURE_BLOB_NAME}?${AZURE_STORAGE_SAS}" \
          "$AZURE_BLOB_NAME"

        docker load -i "$AZURE_BLOB_NAME"
        rm -f "$AZURE_BLOB_NAME" azcopy.tar.gz
      else
        docker pull "$TEMP_IMAGE"
        docker save "$TEMP_IMAGE" -o pandoc-image.tar
      fi

      IGNORE_FILE_ARG=""
      if [ -f ".trivyignore" ]; then
        IGNORE_FILE_ARG="--ignorefile .trivyignore"
      fi

      if [ "$USE_AZURE_BLOB_CACHE" = "true" ]; then
        docker save pandoc-beamer:local -o pandoc-image.tar
      fi

      docker run --rm \
        -v "$CI_PROJECT_DIR:/work" \
        -v "$CI_PROJECT_DIR/$TRIVY_CACHE_DIR:/root/.cache/" \
        -w /work \
        aquasec/trivy:latest image \
        --format template --template "@/contrib/gitlab.tpl" \
        --output gl-container-scanning-report.json \
        --severity CRITICAL,HIGH,MEDIUM \
        --exit-code 1 \
        $IGNORE_FILE_ARG \
        --input pandoc-image.tar

      rm -f pandoc-image.tar

  after_script:
    - docker logout "$CI_REGISTRY" || true

  cache:
    paths:
      - .trivycache/

  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json

# --------------------
# Test Docker Image
# --------------------
test_docker:
  stage: scan_and_test
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build_docker
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - |
      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"

      if [ "$USE_AZURE_BLOB_CACHE" = "true" ]; then
        : "${AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_SAS:?AZURE_STORAGE_SAS is required when USE_AZURE_BLOB_CACHE=true}"

        curl -sSL -o azcopy.tar.gz https://aka.ms/downloadazcopy-v10-linux
        tar -xzf azcopy.tar.gz
        AZCOPY_BIN="$(find . -type f -name azcopy | head -n1)"
        chmod +x "$AZCOPY_BIN"

        "$AZCOPY_BIN" copy \
          "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${AZURE_BLOB_NAME}?${AZURE_STORAGE_SAS}" \
          "$AZURE_BLOB_NAME"

        docker load -i "$AZURE_BLOB_NAME"
        TEST_IMAGE="pandoc-beamer:local"
        rm -f "$AZURE_BLOB_NAME" azcopy.tar.gz
      else
        docker pull "$TEMP_IMAGE"
        TEST_IMAGE="$TEMP_IMAGE"
      fi

    - docker run --rm "$TEST_IMAGE" --version
    - docker run --rm "$TEST_IMAGE" --pdf-engine=xelatex --version || true
    - docker run --rm --entrypoint python3 "$TEST_IMAGE" --version

    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e INPUT_FILE="/data/slides/Minimalist.md" \
        -e OUTPUT_FILE="/data/output/ci-test.pdf" \
        --entrypoint /bin/sh \
        "$TEST_IMAGE" \
        -c "/data/buildPDF"

      test -f "$CI_PROJECT_DIR/output/ci-test.pdf"

# --------------------
# Push to Registry
# --------------------
push_to_registry:
  stage: push_image
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - build_docker
    - test_docker
    - container_scan
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"

      if [ "$USE_AZURE_BLOB_CACHE" = "true" ]; then
        : "${AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required when USE_AZURE_BLOB_CACHE=true}"
        : "${AZURE_STORAGE_SAS:?AZURE_STORAGE_SAS is required when USE_AZURE_BLOB_CACHE=true}"

        curl -sSL -o azcopy.tar.gz https://aka.ms/downloadazcopy-v10-linux
        tar -xzf azcopy.tar.gz
        AZCOPY_BIN="$(find . -type f -name azcopy | head -n1)"
        chmod +x "$AZCOPY_BIN"

        "$AZCOPY_BIN" copy \
          "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${AZURE_BLOB_NAME}?${AZURE_STORAGE_SAS}" \
          "$AZURE_BLOB_NAME"

        docker load -i "$AZURE_BLOB_NAME"
        SOURCE_IMAGE="pandoc-beamer:local"
        rm -f "$AZURE_BLOB_NAME" azcopy.tar.gz
      else
        docker pull "$TEMP_IMAGE"
        SOURCE_IMAGE="$TEMP_IMAGE"
      fi

      IMAGE_TAG="${CI_COMMIT_TAG#v}"
      IMAGE="$CI_REGISTRY_IMAGE/beamer-full:$IMAGE_TAG"

      docker tag "$SOURCE_IMAGE" "$IMAGE"
      docker tag "$SOURCE_IMAGE" "$CI_REGISTRY_IMAGE/beamer-full:latest"

      docker push "$IMAGE"
      docker push "$CI_REGISTRY_IMAGE/beamer-full:latest"

# --------------------
# Cleanup External Cache
# --------------------
cleanup_external_cache:
  stage: cleanup
  image: alpine:3.19
  rules:
    - if: '$USE_AZURE_BLOB_CACHE == "true" && ($CI_COMMIT_TAG =~ $TAG_REGEX || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      when: always
    - when: never
  script:
    - |
      : "${AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT is required when USE_AZURE_BLOB_CACHE=true}"
      : "${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required when USE_AZURE_BLOB_CACHE=true}"
      : "${AZURE_STORAGE_SAS:?AZURE_STORAGE_SAS is required when USE_AZURE_BLOB_CACHE=true}"

      apk add --no-cache curl tar
      curl -sSL -o azcopy.tar.gz https://aka.ms/downloadazcopy-v10-linux
      tar -xzf azcopy.tar.gz
      AZCOPY_BIN="$(find . -type f -name azcopy | head -n1)"
      chmod +x "$AZCOPY_BIN"

      "$AZCOPY_BIN" remove \
        "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${AZURE_BLOB_NAME}?${AZURE_STORAGE_SAS}" \
        || true
  after_script:
    - docker logout "$CI_REGISTRY" || true

# --------------------
# Release
# --------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - push_to_registry
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - apk add --no-cache gettext
    - export TAG_NO_V="${CI_COMMIT_TAG#v}"
    - envsubst < .gitlab/release_notes.md > release_description.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://$CI_REGISTRY_IMAGE/beamer-full:${CI_COMMIT_TAG#v}"
          link_type: image
