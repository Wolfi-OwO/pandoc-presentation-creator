stages:
  - validate_and_security
  - build
  - scan_and_test
  - push_image
  - release

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1

  TAG_REGEX: '/^v\d+\.\d+\.\d+(\.\d+)?$/'

  CS_SEVERITY_THRESHOLD: CRITICAL
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml

workflow:
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

# --------------------
# Shared Templates
# --------------------
.docker_dind_base:
  image: docker:24
  services:
    - docker:24-dind

.main_branch_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

.tag_rules:
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - when: never

# --------------------
# Secret Detection
# --------------------
secret_detection:
  stage: validate_and_security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - gitleaks detect --source . --report-format json --report-path gl-secret-report.json
  artifacts:
    when: always
    reports:
      secret_detection: gl-secret-report.json

# --------------------
# SAST (Semgrep)
# --------------------
sast:
  stage: validate_and_security
  image:
    name: returntocorp/semgrep
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_TAG =~ $TAG_REGEX"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
  script:
    - |
      semgrep scan \
        --config auto \
        --json \
        --severity ERROR \
        --project-dir "$CI_PROJECT_DIR" \
        > gl-sast-report.json || true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

# --------------------
# Dependency Scanning
# --------------------
dependency_scanning:
  stage: scan_and_test

# --------------------
# Fast Path (Main/MR)
# --------------------
build_and_test:
  stage: build
  extends:
    - .docker_dind_base
    - .main_branch_rules
  script:
    - |
      IMAGE_VERSION="$CI_COMMIT_SHORT_SHA"

      docker build \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t "pandoc-beamer:local" \
        -f docker/Dockerfile.beamer .

      docker run --rm pandoc-beamer:local --version
      docker run --rm --entrypoint python3 pandoc-beamer:local --version

      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e INPUT_FILE="/data/slides/Minimalist.md" \
        -e OUTPUT_FILE="/data/output/ci-test.pdf" \
        --entrypoint /bin/sh \
        pandoc-beamer:local \
        -c "/data/buildPDF"

      test -f "$CI_PROJECT_DIR/output/ci-test.pdf"

      IGNORE_FILE_ARG=""
      if [ -f ".trivyignore" ]; then
        IGNORE_FILE_ARG="--ignorefile .trivyignore"
      fi

      docker run --rm \
        -e DOCKER_HOST="$DOCKER_HOST" \
        -e DOCKER_TLS_VERIFY="$DOCKER_TLS_VERIFY" \
        -e DOCKER_CERT_PATH="$DOCKER_CERT_PATH" \
        -v "$DOCKER_CERT_PATH:$DOCKER_CERT_PATH:ro" \
        -v "$CI_PROJECT_DIR:/work" \
        -w /work \
        aquasec/trivy:latest image \
        --severity CRITICAL,HIGH,MEDIUM \
        --exit-code 1 \
        $IGNORE_FILE_ARG \
        pandoc-beamer:local
  artifacts:
    paths:
      - output/ci-test.pdf
    expire_in: 7 days

# --------------------
# Release Path (Tag)
# --------------------
build_docker:
  stage: build
  extends:
    - .docker_dind_base
    - .tag_rules
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login \
        -u "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"
  script:
    - |
      IMAGE_VERSION="${CI_COMMIT_TAG#v}"

      docker build \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        -t "pandoc-beamer:local" \
        -f docker/Dockerfile.beamer .

      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"
      docker tag pandoc-beamer:local "$TEMP_IMAGE"
      docker push "$TEMP_IMAGE"
  after_script:
    - command -v docker >/dev/null 2>&1 && docker logout "$CI_REGISTRY" || true

test_docker:
  stage: scan_and_test
  extends:
    - .docker_dind_base
    - .tag_rules
  needs:
    - build_docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"
      docker pull "$TEMP_IMAGE"

      docker run --rm "$TEMP_IMAGE" --version
      docker run --rm "$TEMP_IMAGE" --pdf-engine=xelatex --version || true
      docker run --rm --entrypoint python3 "$TEMP_IMAGE" --version

      docker run --rm \
        -v "$CI_PROJECT_DIR:/data" \
        -e INPUT_FILE="/data/slides/Minimalist.md" \
        -e OUTPUT_FILE="/data/output/ci-test.pdf" \
        --entrypoint /bin/sh \
        "$TEMP_IMAGE" \
        -c "/data/buildPDF"

      test -f "$CI_PROJECT_DIR/output/ci-test.pdf"
  after_script:
    - command -v docker >/dev/null 2>&1 && docker logout "$CI_REGISTRY" || true

push_to_registry:
  stage: push_image
  extends:
    - .docker_dind_base
    - .tag_rules
  needs:
    - build_docker
    - test_docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      TEMP_IMAGE="$CI_REGISTRY_IMAGE/beamer-full:ci-$CI_PIPELINE_ID"
      docker pull "$TEMP_IMAGE"

      IMAGE_TAG="${CI_COMMIT_TAG#v}"
      IMAGE="$CI_REGISTRY_IMAGE/beamer-full:$IMAGE_TAG"

      docker tag "$TEMP_IMAGE" "$IMAGE"
      docker tag "$TEMP_IMAGE" "$CI_REGISTRY_IMAGE/beamer-full:latest"

      docker push "$IMAGE"
      docker push "$CI_REGISTRY_IMAGE/beamer-full:latest"
  after_script:
    - command -v docker >/dev/null 2>&1 && docker logout "$CI_REGISTRY" || true

# --------------------
# Release
# --------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - push_to_registry
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - apk add --no-cache gettext
    - export TAG_NO_V="${CI_COMMIT_TAG#v}"
    - envsubst < .gitlab/release_notes.md > release_description.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://$CI_REGISTRY_IMAGE/beamer-full:${CI_COMMIT_TAG#v}"
          link_type: image
