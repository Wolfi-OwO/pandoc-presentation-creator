stages:
  - build
  - test

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1

build-beamer:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build -f docker/Dockerfile.beamer \
        -t "$CI_REGISTRY_IMAGE:latest" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
        .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/**
        - core/**
        - scripts/build_beamer.py

render-slides:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs: [build-beamer]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - mkdir -p test-output
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Example.md \
        -o /data/test-output/Example-beamer.pdf
    - ls -lh test-output
  artifacts:
    paths:
      - test-output/Example-beamer.pdf
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/**
        - core/**
        - scripts/build_beamer.py
