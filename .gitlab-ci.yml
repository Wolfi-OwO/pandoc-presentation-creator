stages:
  - registry
  - validation
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/upe:latest

# 1. Registry Stage: Build Omni-Container
build_container:
  stage: registry
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE -f docker/Dockerfile .
    - docker push $DOCKER_IMAGE
  rules:
    - changes:
        - docker/Dockerfile
        - core/templates/**/*

# 2. Validation Stage
lint_markdown:
  stage: validation
  image: node:latest
  script:
    - npm install -g markdownlint-cli
    - markdownlint slides/*.md
  allow_failure: true

# 3. Build Stage (Parallel for formats)
build_presentations:
  stage: build
  image: $DOCKER_IMAGE
  script:
    - |
      for slide in slides/*.md; do
        python3 /app/scripts/build.py --input "$slide" --format all
      done
  artifacts:
    paths:
      - output/
    expire_in: 1 week

# 4. Deploy Stage
pages:
  stage: deploy
  dependencies:
    - build_presentations
  script:
    - mkdir -p public
    - cp output/*.html public/
    # Copy PDFs as well for download
    - cp output/*.pdf public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
