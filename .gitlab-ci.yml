stages:
  - build
  - test
  - docs
  - release

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

# ==============================================================================
# Build Stage: Container Images
# ==============================================================================
.build-template: &docker-build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/$IMAGE_SUFFIX"
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      docker build -f "$DOCKERFILE" \
        -t "$IMAGE_NAME:latest" \
        -t "$IMAGE_NAME:${IMAGE_TAG}" \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker push "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
      else
        docker save "$IMAGE_NAME:latest" "$IMAGE_NAME:${IMAGE_TAG}" -o "${IMAGE_SUFFIX}.tar"
      fi
  artifacts:
    paths:
      - "*.tar"
    expire_in: 1 week
    when: on_success
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build-beamer:
  <<: *docker-build
  stage: build
  variables:
    IMAGE_SUFFIX: beamer-beamer
    DOCKERFILE: docker/Dockerfile.beamer

build-revealjs:
  <<: *docker-build
  stage: build
  variables:
    IMAGE_SUFFIX: beamer-revealjs
    DOCKERFILE: docker/Dockerfile.revealjs

build-base:
  <<: *docker-build
  stage: build
  variables:
    IMAGE_SUFFIX: beamer-base
    DOCKERFILE: docker/Dockerfile.base

# ==============================================================================
# Test Stage: Beamer Templates
# ==============================================================================
test-beamer-templates:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-beamer
      artifacts: true
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-beamer"
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker pull "$IMAGE_NAME:$IMAGE_TAG"
      else
        docker load -i beamer-beamer.tar
      fi
    - mkdir -p test-output
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$IMAGE_NAME:$IMAGE_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Minimalist.md \
        -o /data/test-output/Minimalist-beamer.pdf
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$IMAGE_NAME:$IMAGE_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Project-Demo.md \
        -o /data/test-output/Project-Demo-beamer.pdf
    - ls -lh test-output
    - echo "[OK] All templates rendered successfully"
  artifacts:
    paths:
      - test-output/*.pdf
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# Test Stage: Build Helper
# ==============================================================================
test-build-helper:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-beamer
      artifacts: true
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-beamer"
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker pull "$IMAGE_NAME:$IMAGE_TAG"
      else
        docker load -i beamer-beamer.tar
      fi
    - mkdir -p test-output
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        --entrypoint python3 \
        "$IMAGE_NAME:$IMAGE_TAG" \
        /opt/pandoc/scripts/build_beamer.py \
        --input /data/slides/Minimalist.md \
        --output /data/test-output/helper-test.pdf \
        --metadata footerbadge=CI-TEST
    - ls -lh test-output/helper-test.pdf
    - echo "[OK] Build helper validated"
  artifacts:
    paths:
      - test-output/helper-test.pdf
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# Test Stage: Reveal.js Templates
# ==============================================================================
test-revealjs-templates:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-revealjs
      artifacts: true
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-revealjs"
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker pull "$IMAGE_NAME:$IMAGE_TAG"
      else
        docker load -i beamer-revealjs.tar
      fi
    - mkdir -p test-output
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$IMAGE_NAME:$IMAGE_TAG" \
        --defaults /opt/pandoc/defaults/revealjs.yaml \
        /data/slides/Minimalist.md \
        -o /data/test-output/Minimalist-revealjs.html
    - ls -lh test-output
    - echo "[OK] Reveal.js templates rendered successfully"
  artifacts:
    paths:
      - test-output/*.html
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# Test Stage: Base Image Smoke Test
# ==============================================================================
test-base-image:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-base
      artifacts: true
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-base"
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker pull "$IMAGE_NAME:$IMAGE_TAG"
      else
        docker load -i beamer-base.tar
      fi
    - docker run --rm "$IMAGE_NAME:$IMAGE_TAG" pandoc --version
    - echo "[OK] Base image smoke test passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# Release Stage: Create GitLab Release
# ==============================================================================
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-beamer
      optional: true
    - job: build-revealjs
      optional: true
    - job: build-base
      optional: true
    - job: test-beamer-templates
      optional: true
    - job: test-build-helper
      optional: true
    - job: test-revealjs-templates
      optional: true
    - job: test-base-image
      optional: true
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Pandoc Presentation Creator - Release $CI_COMMIT_TAG

      ### Docker Images
      - Beamer: `$CI_REGISTRY_IMAGE/beamer-beamer:$CI_COMMIT_TAG`
      - Beamer (latest): `$CI_REGISTRY_IMAGE/beamer-beamer:latest`
      - Reveal.js: `$CI_REGISTRY_IMAGE/beamer-revealjs:$CI_COMMIT_TAG`
      - Reveal.js (latest): `$CI_REGISTRY_IMAGE/beamer-revealjs:latest`
      - Base: `$CI_REGISTRY_IMAGE/beamer-base:$CI_COMMIT_TAG`
      - Base (latest): `$CI_REGISTRY_IMAGE/beamer-base:latest`

      ### Usage
      ```bash
      docker pull $CI_REGISTRY_IMAGE/beamer-beamer:$CI_COMMIT_TAG
      docker run --rm -v $(pwd):/data --user root \
        $CI_REGISTRY_IMAGE/beamer-beamer:$CI_COMMIT_TAG \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/your-presentation.md \
        -o /data/output/presentation.pdf
      ```

      ### Test Artifacts
      See the attached PDF and HTML files generated during CI testing.
    assets:
      links:
        - name: "Docker Image: beamer-beamer-$CI_COMMIT_TAG"
          url: "https://$CI_REGISTRY_IMAGE/beamer-beamer:$CI_COMMIT_TAG"
          link_type: image
  rules:
    - if: $CI_COMMIT_TAG
