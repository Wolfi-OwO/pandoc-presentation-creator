stages:
  - build
  - test
  - docs

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1

.image_changes: &image_changes
  - docker/**
  - core/**
  - scripts/**

.example_presentation_changes: &example_presentation_changes
  - slides/**
  - docs/**
  - .gitlab-ci.yml

# ==============================================================================
# Build Stage: Container Image
# ==============================================================================
build-beamer:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build -f docker/Dockerfile.beamer \
        -t "$CI_REGISTRY_IMAGE:beamer-latest" \
        -t "$CI_REGISTRY_IMAGE:beamer-${CI_COMMIT_TAG}" \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_TAG \
        .
    - docker push "$CI_REGISTRY_IMAGE:beamer-latest"
    - docker push "$CI_REGISTRY_IMAGE:beamer-$CI_COMMIT_TAG"
  rules:
    # Rebuild when image-affecting files change
    - if: $CI_COMMIT_TAG
      changes: *image_changes

    # Otherwise, don't run at all
    - when: never

# ==============================================================================
# Test Stage: Template Rendering
# ==============================================================================
test-beamer-templates:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-beamer
      optional: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - mkdir -p test-output
    - docker pull "$CI_REGISTRY_IMAGE:beamer-$CI_COMMIT_TAG"
    # Test Minimalist.md
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$CI_REGISTRY_IMAGE:beamer-$CI_COMMIT_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Minimalist.md \
        -o /data/test-output/Minimalist-beamer.pdf
    # Test Project-Demo.md
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$CI_REGISTRY_IMAGE:beamer-$CI_COMMIT_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Project-Demo.md \
        -o /data/test-output/Project-Demo-beamer.pdf
    - ls -lh test-output
    - echo "[OK] All templates rendered successfully"
  artifacts:
    paths:
      - test-output/*.pdf
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      changes: *image_changes
    - when: never

# ==============================================================================
# Test Stage: Python Build Helper
# ==============================================================================
test-build-helper:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-beamer
      optional: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - mkdir -p test-output
    - docker pull "$CI_REGISTRY_IMAGE:beamer-${CI_COMMIT_TAG:=latest}"
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        --entrypoint python3 \
        "$CI_REGISTRY_IMAGE:beamer-${CI_COMMIT_TAG:=latest}" \
        /opt/pandoc/scripts/build_beamer.py \
        --input /data/slides/Minimalist.md \
        --output /data/test-output/helper-test.pdf \
        --metadata footerbadge=CI-TEST
    - ls -lh test-output/helper-test.pdf
    - echo "[OK] Build helper validated"
  artifacts:
    paths:
      - test-output/helper-test.pdf
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      changes: *example_presentation_changes
    - if: $CI_COMMIT_REF_NAME == "main"
      changes: *example_presentation_changes
