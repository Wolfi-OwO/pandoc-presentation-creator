stages:
  - build-and-test
  - build
  - test
  - release

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/woofi4/public/pandoc-presentation-creator
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

# ==============================================================================
# For MR/Main: Build and Test Locally (No Artifacts, No Registry Push)
# ==============================================================================
build-and-test-beamer-local:
  stage: build-and-test
  image: docker:latest
  services:
    - docker:dind
  script:
    - IMAGE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      docker build -f docker/Dockerfile.beamer \
        -t pandoc-beamer:test \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        .
    - mkdir -p test-output
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        pandoc-beamer:test \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Minimalist.md \
        -o /data/test-output/Minimalist-beamer.pdf
    - |
      test -f test-output/Minimalist-beamer.pdf || (echo "ERROR: Minimalist-beamer.pdf not created" && exit 1)
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        pandoc-beamer:test \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Project-Demo.md \
        -o /data/test-output/Project-Demo-beamer.pdf
    - |
      test -f test-output/Project-Demo-beamer.pdf || (echo "ERROR: Project-Demo-beamer.pdf not created" && exit 1)
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        --entrypoint python3 \
        pandoc-beamer:test \
        /opt/pandoc/scripts/build_beamer.py \
        --input /data/slides/Minimalist.md \
        --output /data/test-output/helper-test.pdf \
        --metadata footerbadge=CI-TEST
    - |
      test -f test-output/helper-test.pdf || (echo "ERROR: helper-test.pdf not created" && exit 1)
    - ls -lh test-output
    - echo "[OK] Beamer build and tests passed - all PDFs generated successfully"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build-and-test-base-local:
  stage: build-and-test
  image: docker:latest
  services:
    - docker:dind
  script:
    - IMAGE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      docker build -f docker/Dockerfile.base \
        -t pandoc-base:test \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        .
    - docker run --rm pandoc-base:test pandoc --version
    - echo "[OK] Base image smoke test passed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ==============================================================================
# For Tags: Build, Push to Registry, Test, Release
# ==============================================================================
build-beamer:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-full"
    - IMAGE_VERSION="$CI_COMMIT_TAG"
    - |
      docker build -f docker/Dockerfile.beamer \
        -t "$IMAGE_NAME:latest" \
        -t "$IMAGE_NAME:$CI_COMMIT_TAG" \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        .
    - docker push "$IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

build-base:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-base"
    - IMAGE_VERSION="$CI_COMMIT_TAG"
    - |
      docker build -f docker/Dockerfile.base \
        -t "$IMAGE_NAME:latest" \
        -t "$IMAGE_NAME:$CI_COMMIT_TAG" \
        --build-arg VERSION="$IMAGE_VERSION" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg VCS_URL="$CI_PROJECT_URL" \
        .
    - docker push "$IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

test-beamer:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-beamer
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-full"
    - docker pull "$IMAGE_NAME:$CI_COMMIT_TAG"
    - mkdir -p test-output
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$IMAGE_NAME:$CI_COMMIT_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Minimalist.md \
        -o /data/test-output/Minimalist-beamer.pdf
    - |
      test -f test-output/Minimalist-beamer.pdf || (echo "ERROR: Minimalist-beamer.pdf not created" && exit 1)
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        "$IMAGE_NAME:$CI_COMMIT_TAG" \
        --defaults /opt/pandoc/defaults/beamer.yaml \
        /data/slides/Project-Demo.md \
        -o /data/test-output/Project-Demo-beamer.pdf
    - |
      test -f test-output/Project-Demo-beamer.pdf || (echo "ERROR: Project-Demo-beamer.pdf not created" && exit 1)
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/data --user root \
        --entrypoint python3 \
        "$IMAGE_NAME:$CI_COMMIT_TAG" \
        /opt/pandoc/scripts/build_beamer.py \
        --input /data/slides/Minimalist.md \
        --output /data/test-output/helper-test.pdf \
        --metadata footerbadge=CI-TEST
    - |
      test -f test-output/helper-test.pdf || (echo "ERROR: helper-test.pdf not created" && exit 1)
    - ls -lh test-output
    - echo "[OK] All beamer tests passed - all PDFs generated successfully"
  artifacts:
    paths:
      - test-output/*.pdf
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

test-base:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build-base
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/beamer-base"
    - docker pull "$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker run --rm "$IMAGE_NAME:$CI_COMMIT_TAG" pandoc --version
    - echo "[OK] Base image test passed"
  rules:
    - if: $CI_COMMIT_TAG

# ==============================================================================
# Release Stage
# ==============================================================================
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-beamer
    - job: build-base
    - job: test-beamer
    - job: test-base
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
    - apk add --no-cache gettext
    - envsubst '$CI_COMMIT_TAG $CI_REGISTRY_IMAGE' < .gitlab/release_notes.md > release_description.md
    - cat release_description.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: release_description.md
    assets:
      links:
        - name: "Docker Image: beamer-full-$CI_COMMIT_TAG"
          url: "https://$CI_REGISTRY_IMAGE/beamer-full:$CI_COMMIT_TAG"
          link_type: image
  rules:
    - if: $CI_COMMIT_TAG
