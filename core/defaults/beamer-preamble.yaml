# ==============================================================================
# Pandoc Defaults for Beamer with Custom Preamble
# ==============================================================================
# This file defines all standard settings for Beamer presentations
# with a custom preamble.
# Usage: pandoc -d defaults/beamer-preamble.yaml input.md -o output.pdf
#
# NOTE: If you see a schema warning in VS Code, it is safe to ignore.
# This file is a Pandoc defaults YAML, not an Ansible or Kubernetes config.

# ------------------------------------------------------------------------------
# Input-Format
# ------------------------------------------------------------------------------
from: markdown

# ------------------------------------------------------------------------------
# Output Configuration
# ------------------------------------------------------------------------------
to: beamer
standalone: true
pdf-engine: xelatex
dpi: 300
slide-level: 2
highlight-style: tango
output-file: /data/output/presentation_preamble.pdf

# ------------------------------------------------------------------------------
# Data Directory and Resource Paths
# ------------------------------------------------------------------------------
data-dir: /opt/pandoc
resource-path:
  - /opt/pandoc
  - /opt/pandoc/includes
  - /opt/pandoc/assets
  - /opt/pandoc/metadata
  - .
# ------------------------------------------------------------------------------
# Templates & Includes
# ------------------------------------------------------------------------------
template: templates/default_mod.latex
include-in-header:
  - includes/beamer-preamble.tex

# ------------------------------------------------------------------------------
# Beamer Theme & Variables
# ------------------------------------------------------------------------------
variables:
  theme: metropolis
  colortheme: default
  fonttheme: metropolis
  navigation: empty
  section-titles: true
  classoption:
    - aspectratio=169
