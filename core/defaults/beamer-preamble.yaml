# ==============================================================================
# Pandoc Defaults für Beamer mit UBC-Styled Preamble
# ==============================================================================
# Diese Datei definiert alle Standard-Einstellungen für Beamer-Präsentationen
# mit benutzerdefinierter Preamble.
# Sie kann mit: pandoc -d defaults/beamer-preamble.yaml input.md -o output.pdf
# aufgerufen werden.
#
# NOTE: If you see a schema warning in VS Code, it is safe to ignore.
# This file is a Pandoc defaults YAML, not an Ansible or Kubernetes config.

# ------------------------------------------------------------------------------
# Input-Format
# ------------------------------------------------------------------------------
from: markdown

# ------------------------------------------------------------------------------
# Output-Konfiguration
# ------------------------------------------------------------------------------
to: beamer
standalone: true
pdf-engine: xelatex
dpi: 300
slide-level: 2
highlight-style: tango
output-file: /data/output/presentation_preamble.pdf

# ------------------------------------------------------------------------------
# Templates & Includes
# ------------------------------------------------------------------------------
template: templates/default_mod.latex
include-in-header:
  - templates/preamble.tex

# ------------------------------------------------------------------------------
# Beamer Theme & Variables
# ------------------------------------------------------------------------------
variables:
  classoption:
    - aspectratio=169
  theme: Singapore
  navigation: horizontal
  section-titles: true
