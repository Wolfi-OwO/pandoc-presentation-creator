# ==============================================================================
# Pandoc Defaults for Beamer Presentations
# ==============================================================================
# This file defines all standard settings for Beamer presentations.
# It is optimized for use in the Docker image and is directly included.
# Usage: pandoc -d defaults/beamer.yaml input.md -o output.pdf

# ------------------------------------------------------------------------------
# Input-Format
# ------------------------------------------------------------------------------
from: markdown

# ------------------------------------------------------------------------------
# Output-Konfiguration
# ------------------------------------------------------------------------------
to: beamer
standalone: true
pdf-engine: xelatex
dpi: 300
slide-level: 1
output-file: /data/output/presentation.pdf

# ------------------------------------------------------------------------------
# Datenverzeichnis und Ressourcenpfade
# ------------------------------------------------------------------------------
data-dir: /opt/pandoc
resource-path:
  - /opt/pandoc
  - /opt/pandoc/includes
  - /opt/pandoc/assets
  - /opt/pandoc/metadata
  - .

# ------------------------------------------------------------------------------
# Templates & Includes
# ------------------------------------------------------------------------------
template: templates/default_mod.latex
include-in-header:
  - includes/beamer-preamble.tex

# ------------------------------------------------------------------------------
# Beamer Theme & Variables
# ------------------------------------------------------------------------------
variables:
  theme: metropolis
  colortheme: default
  fonttheme: metropolis
  classoption:
    - aspectratio=169
  navigation: empty
  section-titles: false
  highlight-style: tango

# ------------------------------------------------------------------------------
# Filter
# ------------------------------------------------------------------------------
filters:
  - /opt/pandoc/filters/additional-metadata.lua

# ------------------------------------------------------------------------------
# Metadata-Dateien
# ------------------------------------------------------------------------------
metadata-files:
  - /opt/pandoc/metadata/common.yaml
