# Pandoc defaults for Beamer (baked into Docker image)

from: markdown
to: beamer
standalone: true
pdf-engine: xelatex
dpi: 300
slide-level: 1
data-dir: /opt/pandoc
resource-path:
  - /opt/pandoc
  - /opt/pandoc/includes
  - /opt/pandoc/assets
  - /opt/pandoc/metadata
  - .
output-file: /data/output/presentation.pdf

template: templates/default_mod.latex
include-in-header:
  - includes/beamer-preamble.tex

variables:
  theme: Madrid
  colortheme: default
  fonttheme: default
  classoption:
    - aspectratio=169
  navigation: horizontal
  section-titles: false
  highlight-style: tango

metadata-files:
  - /opt/pandoc/metadata/common.yaml

