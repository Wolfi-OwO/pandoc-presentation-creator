# ------------------------------------------------------------------------------
# Pandoc Defaults for PowerPoint (PPTX) Presentations
# ------------------------------------------------------------------------------
# This file defines all default settings for PPTX presentations.
# It can be used with: pandoc -d defaults/pptx.yaml input.md -o output.pptx

# ------------------------------------------------------------------------------
# Output Configuration
# ------------------------------------------------------------------------------
to: pptx
output-file: output/presentation.pptx

# ------------------------------------------------------------------------------
# PowerPoint-Specific Options
# ------------------------------------------------------------------------------
variables:
  # Code highlighting
  highlight-style: pygments

# ------------------------------------------------------------------------------
# Metadata Files
# ------------------------------------------------------------------------------
metadata-files:
  - metadata/common.yaml

# ------------------------------------------------------------------------------
# Filters
# ------------------------------------------------------------------------------
# filters:
#   - filters/custom-filter.lua

# ------------------------------------------------------------------------------
# Reference Document (PowerPoint Template)
# ------------------------------------------------------------------------------
# Use an existing PPTX document as a layout template
# reference-doc: templates/pptx/custom-template.pptx

# ------------------------------------------------------------------------------
# Markdown Extensions
# ------------------------------------------------------------------------------
from: markdown+smart+footnotes+definition_lists+fenced_divs+bracketed_spans

# ------------------------------------------------------------------------------
# Table of Contents
# ------------------------------------------------------------------------------
toc: false
toc-depth: 2

# ------------------------------------------------------------------------------
# Additional Options
# ------------------------------------------------------------------------------
# Slide Level (1 = each H1 heading becomes a slide)
slide-level: 2

# ------------------------------------------------------------------------------
# Incremental Lists
# ------------------------------------------------------------------------------
# Each item appears one by one
incremental: false

# ------------------------------------------------------------------------------
# Images
# ------------------------------------------------------------------------------
# Default image size (in inches)
# dpi: 96

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------
# Speaker notes are automatically added to the notes section
# Use in Markdown: ::: notes ... :::
