# ==============================================================================
# Pandoc Defaults for Reveal.js Presentations
# ==============================================================================
# This file defines all standard settings for Reveal.js presentations.
# Usage: pandoc -d defaults/revealjs.yaml input.md -o output.html

# Output Configuration
# ==============================================================================
to: revealjs
output-file: output/presentation.html

# Standalone document with all required dependencies
standalone: true

# Reveal.js Specific Options
# ==============================================================================
variables:
  # Reveal.js theme (black, white, league, beige, sky, night, serif, simple, solarized, moon)
  theme: moon

  # Transitions (none, fade, slide, convex, concave, zoom)
  transition: slide

  # Transition speed (default, fast, slow)
  transition-speed: default

  # Background transition (none, fade, slide, convex, concave, zoom)
  background-transition: fade

  # Presentation controls
  controls: true
  controlsTutorial: true
  controlsLayout: bottom-right

  # Progress indicator
  progress: true

  # Display slide numbers
  slideNumber: true

  # Hash-based URLs for slides
  hash: true

  # Navigation
  keyboard: true
  overview: true
  center: true
  touch: true
  loop: false
  rtl: false

  # Fragments
  fragments: true

  # Embed settings
  embedded: false

  # Display speaker notes
  showNotes: false

  # Auto-slide (0 = disabled)
  autoSlide: 0

  # Mouse-wheel navigation
  mouseWheel: false

  # Presentation size
  width: 1920
  height: 1080
  margin: 0.04
  minScale: 0.2
  maxScale: 2.0

  # Code highlighting
  highlight-style: monokai

# ------------------------------------------------------------------------------
# Metadata-Dateien
# ------------------------------------------------------------------------------
metadata-files:
  - metadata/common.yaml

# ------------------------------------------------------------------------------
# Filter
# ------------------------------------------------------------------------------
# filters:
#   - filters/custom-filter.lua

# ------------------------------------------------------------------------------
# Includes
# ------------------------------------------------------------------------------
include-in-header:
  - includes/header/revealjs-custom.html

include-after-body:
  - includes/footer/revealjs-footer.html

# ------------------------------------------------------------------------------
# Template
# ------------------------------------------------------------------------------
# template: templates/revealjs/custom-template.html

# ------------------------------------------------------------------------------
# Markdown-Erweiterungen
# ------------------------------------------------------------------------------
from: markdown+emoji+smart+footnotes+definition_lists+fenced_divs+bracketed_spans

# ------------------------------------------------------------------------------
# Inhaltsverzeichnis
# ------------------------------------------------------------------------------
toc: false
toc-depth: 2

# ------------------------------------------------------------------------------
# Code-Blöcke
# ------------------------------------------------------------------------------
listings: false
highlight-style: monokai

# ------------------------------------------------------------------------------
# Mathematik
# ------------------------------------------------------------------------------
# Für mathematische Formeln
html-math-method: mathjax

# ------------------------------------------------------------------------------
# Zusätzliche Ressourcen
# ------------------------------------------------------------------------------
css:
  - assets/css/custom-revealjs.css

# ------------------------------------------------------------------------------
# Selbst-gehostete Reveal.js Version (optional)
# ------------------------------------------------------------------------------
# revealjs-url: https://unpkg.com/reveal.js@4.5.0/
