# ------------------------------------------------------------------------------
# Shared Metadata for All Presentations
# ------------------------------------------------------------------------------
# This file contains metadata used for all presentation types.
# It is automatically included in defaults files.

# ------------------------------------------------------------------------------
# Author information
# ------------------------------------------------------------------------------
author:
  - Max Example

# ------------------------------------------------------------------------------
# Alternative: Multiple Authors
# ------------------------------------------------------------------------------
# author:
#   - Max Mustermann
#   - Jane Doe

# ------------------------------------------------------------------------------
# Title and Subtitle
# ------------------------------------------------------------------------------
title: "Example Presentation"
subtitle: "A modular Pandoc project"

# ------------------------------------------------------------------------------
# Date
# ------------------------------------------------------------------------------
date: 2026-01-10

# ------------------------------------------------------------------------------
# Alternative: Automatic Date
# ------------------------------------------------------------------------------
# date: \today

# ------------------------------------------------------------------------------
# Institution and Organization
# ------------------------------------------------------------------------------
institute: "My Organization"

# ------------------------------------------------------------------------------
# Short Variants for Navigation and Footer (Beamer)
# ------------------------------------------------------------------------------
shorttitle: "Short Title"
shortauthor: "M. Example"
shortinstitute: "My Org"

# ------------------------------------------------------------------------------
# Language
# ------------------------------------------------------------------------------
lang: en

# ------------------------------------------------------------------------------
# Abstract and Description
# ------------------------------------------------------------------------------
# abstract: |
#   A short summary of the presentation.
#   Can span multiple lines.

# ------------------------------------------------------------------------------
# Keywords
# ------------------------------------------------------------------------------
keywords:
  - Pandoc
  - Presentation
  - Markdown

# ------------------------------------------------------------------------------
# Footer Note (Default core/includes/beamer-preamble.tex)
# ------------------------------------------------------------------------------
# left: date
# center: shortauthor/author
# right: page x of y

