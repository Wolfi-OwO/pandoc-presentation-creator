# ==============================================================================
# Docker Compose Configuration - GitLab Container Registry
# ==============================================================================
# Vereinfacht die Verwendung der verschiedenen Pandoc-Images
# Verwendung:
#   docker compose run revealjs examples/minimal.md -o output/test.html
#   docker compose run beamer examples/minimal.md -o output/test.pdf

version: '3.8'

# ==============================================================================
# Services
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Base Service - Minimales Pandoc
  # ----------------------------------------------------------------------------
  base:
    image: registry.gitlab.com/woofi4/public/pandoc-presentation-creator/pandoc-base:latest
    volumes:
      - ./:/data
    working_dir: /data
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["pandoc"]
    profiles: ["base", "all"]

  # ----------------------------------------------------------------------------
  # Reveal.js Service - HTML Präsentationen
  # ----------------------------------------------------------------------------
  revealjs:
    image: registry.gitlab.com/woofi4/public/pandoc-presentation-creator/pandoc-revealjs:latest
    volumes:
      - ./:/data
    working_dir: /data
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PANDOC_DATA_DIR=/pandoc
    entrypoint: ["pandoc"]
    profiles: ["revealjs", "web", "all"]

  # ----------------------------------------------------------------------------
  # Beamer Service - PDF Präsentationen
  # ----------------------------------------------------------------------------
  beamer:
    image: registry.gitlab.com/woofi4/public/pandoc-presentation-creator/pandoc-beamer:latest
    volumes:
      - ./:/data
    working_dir: /data
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PANDOC_DATA_DIR=/pandoc
    entrypoint: ["pandoc"]
    profiles: ["beamer", "pdf", "all"]

  # ----------------------------------------------------------------------------
  # Watch Service - Automatische Rebuilds (optional)
  # ----------------------------------------------------------------------------
  watch:
    image: registry.gitlab.com/woofi4/public/pandoc-presentation-creator/pandoc-revealjs:latest
    volumes:
      - ./:/data
    working_dir: /data
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c "
      echo 'Watching for changes in /data/examples...';
      while true; do
        inotifywait -e modify,create /data/examples/*.md 2>/dev/null &&
        pandoc -d /pandoc/defaults/revealjs.yaml examples/example-presentation.md -o output/live.html &&
        echo 'Rebuilt: output/live.html'
      done
      "
    profiles: ["watch"]

# ==============================================================================
# Verwendungsbeispiele
# ==============================================================================
# 
# Setup (einmalig):
#   export UID=$(id -u)
#   export GID=$(id -g)
#
# Reveal.js:
#   docker compose run --rm revealjs \
#     -d /pandoc/defaults/revealjs.yaml examples/minimal.md -o output/slides.html
#
# Beamer:
#   docker compose run --rm beamer \
#     -d /pandoc/defaults/beamer.yaml examples/minimal.md -o output/slides.pdf
#
# Base (einfache Konvertierung):
#   docker compose run --rm base examples/minimal.md -o output/simple.html
#
# Watch-Mode (automatische Rebuilds):
#   docker compose --profile watch up
#
# Alle Services verfügbar machen:
#   docker compose --profile all config
#
# ==============================================================================
